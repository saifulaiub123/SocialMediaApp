<div class="row">
  <div class="col-md-6">
    <nb-card>
      <nb-card-header *ngIf="id === 0">Add Subscription Plan</nb-card-header>
      <nb-card-header *ngIf="id > 0">Edit Subscription Plan</nb-card-header>
      <nb-card-body>
        <form [formGroup]="form" (ngSubmit)="save()">
          <div class="form-group row">
            <label for="inputEmail1" class="label col-sm-3 col-form-label">Name</label>
            <div class="col-sm-9">
              <input
                type="text"
                nbInput
                fullWidth id="inputName"
                placeholder="Name"
                formControlName="name"
                [attr.aria-invalid]="name.invalid && name.touched ? true : null"
                >
                <ngx-validation-message label="Name"
                  [showRequired]="name?.errors?.required && name.touched">
                </ngx-validation-message>
            </div>
          </div>
          <div class="form-group row">
            <label for="inputEmail1" class="label col-sm-3 col-form-label">Description</label>
            <div class="col-sm-9">
              <input 
              type="text" 
              nbInput 
              fullWidth 
              id="inputDescription" 
              placeholder="description" 
              formControlName="Description">
            </div>
          </div>
          <div class="form-group row">
            <label for="inputEmail1" class="label col-sm-3 col-form-label">Price</label>
            <div class="col-sm-9">
              <input 
              type="number" 
              nbInput 
              fullWidth 
              id="inputPrice" 
              placeholder="Price" 
              formControlName="price"
              [attr.aria-invalid]="price.invalid && price.touched ? true : null"
              >
            </div>
          </div>
          <div class="form-group row">
            <label for="inputEmail1" class="label col-sm-3 col-form-label">Discount</label>
            <div class="col-sm-9">
              <input 
              type="number" 
              nbInput 
              fullWidth 
              id="inputDiscount" 
              placeholder="iscount" 
              formControlName="discount">
            </div>
          </div>
          <div class="form-group row">
            <label for="inputEmail1" class="label col-sm-3 col-form-label">Maximun Users</label>
            <div class="col-sm-9">
              <input 
              type="number" 
              nbInput 
              fullWidth 
              id="inputMaxUsers" 
              placeholder="Maximun Users" 
              formControlName="maxUsers"
              [attr.aria-invalid]="maxUsers.invalid && maxUsers.touched ? true : null">
            </div>
          </div>
          <div class="form-group row">
            <label for="inputEmail1" class="label col-sm-3 col-form-label">Maximun Reports</label>
            <div class="col-sm-9">
              <input 
              type="text" 
              nbInput 
              fullWidth 
              id="inputMaxReports" 
              placeholder="Maximun Reports" 
              formControlName="maxReports">
            </div>
          </div>
          <div class="form-group row">
            <div class="offset-sm-3 col-sm-9">
              <button
              type="submit"
              nbButton status="primary"
              [disabled]="!form.valid"
              >Save</button>
            </div>
          </div>
        </form>
      </nb-card-body>
    </nb-card>
</div>
